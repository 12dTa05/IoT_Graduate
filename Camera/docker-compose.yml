services:
  rtsp_server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp_server
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
  cam1:
    build: .
    container_name: cam1
    depends_on:
      - rtsp_server
    environment:
      - VIDEO_FILE=/videos/crowd_peace.mp4
      - RTSP_URL=rtsp://rtsp_server:8554/cam1
    volumes:
      - ./videos:/videos
    restart: unless-stopped

  cam2:
    build: .
    container_name: cam2
    depends_on:
      - rtsp_server
    environment:
