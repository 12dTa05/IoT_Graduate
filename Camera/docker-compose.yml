services:
  rtsp_server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp_server
    ports:
      - "${RTSP_PORT}:8554"
      - "${HLS_PORT}:8888"
    restart: unless-stopped

  cam1:
    build: .
    container_name: cam1
    depends_on:
      - rtsp_server
    environment:
      - VIDEO_FILE=${CAM1_VIDEO_FILE}
      - RTSP_URL=${CAM1_RTSP_URL}
    volumes:
      - ./videos:/videos
    restart: unless-stopped
