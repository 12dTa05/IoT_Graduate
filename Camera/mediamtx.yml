# ── Logging ──────────────────────────────────────────────────
logLevel: error
logDestinations: [stdout]

# ── RTSP server ──────────────────────────────────────────────
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# ── Disable unused protocols to save overhead ────────────────
rtmp: no
hls: no
webrtc: no
api: no

# ── Stream paths ─────────────────────────────────────────────
paths:
  all_others:
    source: publisher
