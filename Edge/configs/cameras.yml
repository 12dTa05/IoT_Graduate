# ============================================================
# cameras.yml — Cấu hình đa camera cho hệ thống Multi-Stream
# ============================================================
# WARNING: This file lives on EACH Jetson and must be customized
# per device. Update the RTSP URIs below to point to the cameras
# physically connected to THIS Jetson.
#
#   Jetson A (192.168.212.20) → cam_01, cam_02, cam_03, cam_04  (this file)
#   Jetson B (192.168.212.21) → cam_05, cam_06, cam_07, cam_08  (see Edge_B/)
#
# Để thêm camera: copy block cam_XX, đặt enabled: true
# Để tắt camera:  đặt enabled: false (KHÔNG xóa, hệ thống sẽ xóa luồng động)
# Khi file này được lưu, hệ thống sẽ tự phát hiện thay đổi (~100ms qua inotify + debounce)
#
# NOTE: source_points and roi_polygon are in MUX resolution (1280×720).
# If MUX_WIDTH/MUX_HEIGHT changes, scale all coordinates by the new ratio.
# Original 1920×1080 coords scaled by 1280/1920=0.6667, 720/1080=0.6667.
# ============================================================
max_streams: 8

# Chế độ hiển thị lưới (chỉ áp dụng khi output mode = display)
# auto: tự tính rows/cols dựa trên số camera đang bật
# fixed: dùng giá trị rows/cols bên dưới
tiler_mode: auto
tiler_rows: 4
tiler_cols: 2

cameras:
  cam_01:
    camera_id: "cam_01"
    source_id: 0
    uri: "rtsp://192.168.212.20:8554/cam1"
    enabled: true
    name: "Camera 01"
    fps: 25.0
    speed_limit_kmh: 80.0
    homography:
      source_points:
        - [427, 71]
        - [851, 65]
        - [1221, 645]
        - [57, 643]
      target_width: 15
      target_height: 35
    roi_polygon: [427, 71, 851, 65, 1221, 645, 57, 643]
    output:
      record: true
      record_path: "output/cam_01.mp4"

  cam_02:
    camera_id: "cam_02"
    source_id: 1
    uri: "rtsp://192.168.212.20:8554/cam2"
    enabled: true
    name: "Camera02 - Điểm đo phía Nam"
    fps: 25.0
    speed_limit_kmh: 80.0
    homography:
      source_points:
        - [427, 71]
        - [851, 65]
        - [1221, 645]
        - [57, 643]
      target_width: 15
      target_height: 35
    roi_polygon: [427, 71, 851, 65, 1221, 645, 57, 643]
    output:
      record: true
      record_path: "output/cam_02.mp4"

