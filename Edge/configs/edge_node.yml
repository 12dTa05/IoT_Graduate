# ============================================================
# edge_node.yml — P2P Orchestration Parameters only
#
# All scalar settings (node_id, fps, max_streams, signaling,
# health interval, etc.) live in Edge/.env — not here.
# This file holds only the structured P2P tuning that cannot
# be expressed as flat key=value pairs.
# ============================================================

p2p:
  overload_threshold: 65.0      # load_score above this triggers RFO
  overload_duration_s: 5.0     # must be overloaded this long before RFO
  cooldown_s: 15.0              # per-camera cooldown between migrations
  migration_timeout_s: 2.0     # wait for ADD ack before rollback
  heartbeat_timeout_s: 5.0      # peer declared OFFLINE after this silence
  vote_window_s: 3.0            # proposal collection duration
  failover_jitter_max_s: 3.0    # random delay before failover ADD (race prevention)

  # epsilon-Constraint tiers (Pareto optimization)
  eps_fps_strict: 15.0          # Tier 0 — strict FPS floor
  eps_fps_tier1: 12.0           # Tier 1 relaxation
  eps_fps_tier2: 10.0           # Tier 2 relaxation
  eps_network_ms_strict: 30.0   # Tier 0 — RTSP RTT ceiling
  eps_network_ms_tier1: 60.0    # Tier 1 relaxation
  eps_streams_max: 8            # Hard capacity ceiling (matches cameras.yml max_streams)

  # FPS prediction model — calibrate offline per Jetson model
  # key = number of streams AFTER accepting the new camera
  fps_model:
    1: 30.0
    2: 25.0
    3: 20.5
    4: 12.5

  # ---------------------------------------------------------------------------
  # Multi-level offload (Levels 1–3 from the paper)
  # offload_level: 0 = disabled (current behaviour)
  #                1 = Level 1  full-stream RTSP migration (existing)
  #                2 = Level 2  vehicle-crop offload
  #                3 = Level 3  plate-crop offload
  # The orchestrator escalates automatically: 3 → 2 → 1.
  # Set offload_level: 0 to keep the system running exactly as before.
  # ---------------------------------------------------------------------------
  offload_level: 0

  # Load thresholds that trigger each escalation step
  offload_level3_threshold: 65.0   # ≥ this load → try plate-crop offload first
  offload_level2_threshold: 72.0   # ≥ this load → escalate to vehicle-crop offload
  offload_level1_threshold: 80.0   # ≥ this load → escalate to full stream migration (DEBUG: lowered for testing)

  # Cooldown between level changes for the same camera (seconds)
  offload_level_cooldown_s: 12.0

  # TensorRT engine paths used by the offload receiver (Level 2 + 3)
  lpr_engine_path: "models/lpr.engine"
  lpd_engine_path: "models/lpd.engine"

# ---------------------------------------------------------------------------
# Load-score adaptive ω weights
# Three presets; the health agent selects based on runtime context.
#
#   normal   — default balanced weights
#   thermal  — shift weight to hardware-overload term when GPU is hot
#   bandwidth— shift weight to CPU/throughput term when running many cameras
#
# weight order: [w_gpu, w_cpu, w_ram]  (must sum to 1.0)
# ---------------------------------------------------------------------------
load_score:
  thermal_threshold_c: 75.0       # gpu_temp_c ≥ this → use thermal preset
  stream_bandwidth_threshold: 3   # active_cameras ≥ this → use bandwidth preset

  weights_normal:    [0.5, 0.3, 0.2]
  weights_thermal:   [0.3, 0.2, 0.5]
  weights_bandwidth: [0.2, 0.5, 0.3]

  # FPS-drop penalty cap (additive points on top of weighted hardware score)
  fps_penalty_max: 25.0

