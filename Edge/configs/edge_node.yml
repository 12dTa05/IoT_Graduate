# ============================================================
# edge_node.yml — P2P Orchestration Parameters only
#
# All scalar settings (node_id, fps, max_streams, signaling,
# health interval, etc.) live in Edge/.env — not here.
# This file holds only the structured P2P tuning that cannot
# be expressed as flat key=value pairs.
# ============================================================

p2p:
  overload_threshold: 55.0      # load_score at or above this triggers RFO; L3 anchor
                                   # under Base + Bonus load_score (L3=60)
  overload_duration_s: 3.0     # must be overloaded this long before RFO
                                   # quick reaction (3s) while filtering instant 1s telemetry jitter
  cooldown_s: 6.0              # per-camera cooldown between migrations
                                   # prevents ping-pong while allowing rebalancing
  migration_timeout_s: 12.0    # wait for ADD ack before rollback (restored to safe default;
                                 # 2 s was too tight for slow RTSP sources across LAN)
  add_ack_timeout_s: 8.0      # max wait on receiver for ADD stream to reach PLAYING (must be < migration_timeout_s)
  heartbeat_timeout_s: 5.0      # peer declared OFFLINE after this silence
  failover_grace_s: 10.0        # grace period between heartbeat timeout and offline declaration; allows Zenoh mesh reconvergence after container restart without triggering false-offline cascades
  failover_convergence_grace_s: 15.0 # suppress mutual false-offline cascade during failover convergence
  rescue_claim_window_s: 1.0    # claim window to collect peer rescue claims before ADD
  rescue_claim_lease_s: 15.0   # duration during which an active peer claim suppresses local ADD
  failover_retry_interval_s: 30.0 # re-arm interval (s): retry a failed failover while the peer stays dead instead of latching until its heartbeat revives
  recovery_wait_s: 60.0        # wait 60s in recovery before re-adding locally-owned cameras
  vote_window_s: 5.0            # proposal collection duration
  failover_jitter_max_s: 5.0    # random delay before failover ADD (race prevention)
  reclaim_margin: 12.0         # reclaim only when load < (overload_threshold - reclaim_margin)
                                # 55 - 12 = 43; enables reclaim once score drops below 43
  reclaim_stable_s: 5.0        # load must stay below reclaim threshold this long before
                                # reclaiming — 5s confirms genuine recovery
  reclaim_stability_s: 6.0     # post-reclaim observation window (seconds): a just-returned
                                # camera cannot be offloaded during this window; prevents oscillation
                                # from transient FPS spikes during stream warm-up.
  bounce_max: 3                # max migrations per camera in bounce_window_s before L1 exclusion
  bounce_window_s: 60.0        # bounce observation window (seconds)
  zombie_timeout_count: 3      # consecutive migration timeouts before excluding peer from selection

  # Static node-to-camera ownership mapping (for cluster topology & failover isolation)
  node_camera_map:
    jetson_A: ["cam_01", "cam_02"]
    jetson_B: ["cam_03", "cam_04"]
    jetson_C: ["cam_05", "cam_06"]

  # Thermal admission gate for peer selection
# Refuses to offload to a peer whose gpu_temp_c suggests unsafe conditions.
# Unknown / missing values: behaviour controlled by reject_invalid + invalid_policy.
  thermal:
    admission_enabled: true  # set false to disable the gate entirely (audit mode only)
    max_gpu_temp_c: 85.0     # peer gpu_temp_c above this → reject as offload target
    reject_invalid: true     # when true, peers with None/missing gpu_temp_c are rejected
    # invalid_policy: what to do when temperature is known missing/zero
    # "conservative" (default) → reject if reject_invalid is also true
    # "permissive"     → accept anyway (override reject_invalid for unknown data)
    invalid_policy: conservative

  # epsilon-Constraint tiers (Pareto optimization)
  eps_fps_strict: 25.0          # Tier 0 — strict FPS floor
  eps_fps_tier1: 21.0           # Tier 1 relaxation
  eps_fps_tier2: 18.0           # Tier 2 relaxation
  eps_network_ms_strict: 30.0   # Tier 0 — RTSP RTT ceiling
  eps_network_ms_tier1: 60.0    # Tier 1 relaxation
  eps_streams_max: 4            # Hard capacity ceiling

  # Multi-objective bid scoring weights for RFO F(x)
  bid_weights:
    w_load: 0.50   # current load pressure (0-100 normalized)
    w_fps: 0.25    # predicted FPS degradation relative to target_fps
    w_rtt: 0.15    # network latency relative to eps_net_ms
    w_therm: 0.10  # thermal headroom consumption above onset_c

  # Offload policy: "p2p_pareto" (default), "no_offload", "round_robin",
  # "least_load_greedy", "centralized_greedy" (for baseline comparison)
  policy: "p2p_pareto"

  # FPS prediction model — calibrate offline per Jetson model
  # key = number of streams AFTER accepting the new camera
  fps_model:
    1: 30.0
    2: 25.0
    3: 20.5
    4: 15.5

  # ---------------------------------------------------------------------------
  # Multi-level offload (Levels 1–3 from the paper)
  # offload_level: 0 = disabled — bypass ladder, jump straight to Level 1 only
  #                1 = Level 1 only  (full-stream RTSP migration)
  #                2 = Level 2 + 1   (vehicle-crop offload, then stream migration)
  #                3 = Level 3 + 2 + 1 (full escalation ladder — plate → vehicle → stream)
  # The orchestrator escalates automatically: 3 → 2 → 1.
  # Set offload_level: 0 to skip fine-grained offload and go straight to migration.
  # ---------------------------------------------------------------------------
  offload_level: 3

  # Load thresholds that trigger each escalation step
  # Calibrated for the weighted multi-signal composite load_score:
  #   L3: 42.0 (plate crops) · L2: 50.0 (vehicle crops) · L1: 60.0 (stream migration)
  offload_level3_threshold: 55.0   # L3: crop offload → plate-crop offload first
  offload_level2_threshold: 64.0   # L2: vehicle-crop offload when load worsens
  offload_level1_threshold: 72.0   # L1: fall-stream RTSP migration at critical load

  # Cooldown between level changes for the same camera (seconds)
  offload_level_cooldown_s: 6.0

  # Minimum dwell time (seconds) before escalation from a lower level.
  # Prevents premature escalation while the lower-level offload takes effect.
  # Dwell starts when set_offload_level commits L3/L2 for that camera.
  # Bypassed if a hardware emergency fuse is explicitly active.
  l3_dwell_s: 4.0    # L3 must remain active this long before L2
  l2_dwell_s: 5.0     # L2 must remain active this long before L1
  offload_release_dwell_s: 5.0  # Duration node must stay below thr3 before clearing L2/L3 offload
  l2_no_improvement_s: 30.0     # Max dwell at Level 2 without load dropping below thr3 before escalating to L1
  offload_session_idle_s: 10.0   # receiver session TTL in seconds

  # TensorRT engine paths used by the offload receiver (Level 2 + 3)
  lpr_engine_path: "models/lpr.engine"
  lpd_engine_path: "models/lpd.engine"

# ---------------------------------------------------------------------------
# Load score — Completion-Primary (Service Mode) with Legacy Fallback
#
# Form (mode: service):
#   instant_completion = d_fin / (d_fin + d_miss) over evaluation interval
#   service_ema = ema_alpha * instant_completion + (1 - ema_alpha) * service_ema
#   service_score = piecewise linear on [0, 100] from target (0.95 -> 0) to floor (0.50 -> 100)
#   load_score = max(service_score, fps_emergency_floor [80 if FPS < 12], hw_fuse_floor [80 if CPU/RAM >= 90])
# ---------------------------------------------------------------------------
load_score:
  mode: service            # service (unified: completion-deficit ∨ workload-pressure ∨ fps/hw floors) | legacy (workload/FPS fallback)
  service:
    target: 0.95
    floor: 0.50
    ema_alpha: 0.30
    ema_stale_s: 30.0
    min_track_frames: 5
    fps_emergency: 12.0
  hw_fuse_threshold: 90.0
  hw_fuse_score_floor: 80.0

  # Workload-primary + FPS-confirmation policy gating
  workload_policy:
    enabled: true
    w_low: 6.0
    w_high: 10.0
    fps_confirm: 22.0
    fps_critical: 15.0
    alpha_ema: 0.33

  workload:
    enabled: true
    capacity: 40.0
    max_bonus: 15.0

  thermal:
    enabled: true
    onset_c: 70.0
    critical_c: 85.0
    max_bonus: 5.0

  recv:
    enabled: true
    capacity: 10.0
    max_bonus: 5.0

  trend:
    enabled: true
    window_s: 3.0
    max_decline_fps_per_s: 2.0
    max_bonus: 5.0

  proactive_bonus:
    max_bonus: 10.0

# ---------------------------------------------------------------------------
# Proactive load model — Vehicle-Driven Proactive Load Profiling
#
# Coefficients are fitted offline by tools/fit_coefficients.py on data
# collected from the target Jetson via tools/profile_collect.py.
#
# Workflow:
#   1. Measure W_base:
#        python3 tools/profile_collect.py --wbase --wbase-output logs/wbase.txt
#   2. Collect calibration data (10 min, varying traffic density):
#        python3 tools/profile_collect.py --output logs/calibration.csv \
#                --wbase-ref <W_base from step 1>
#   3. Fit coefficients:
#        python3 tools/fit_coefficients.py --csv logs/calibration.csv \
#                --wbase <W_base> --output configs/edge_node.yml
#   4. Set enabled: true and restart.
#
# Formula (L_proactive normalised to [0,1]):
#   L = (W_base + Σ_cam[α₁·N_track + α₂·N_track² + β·N_plate + γ·S]) / 100
#   H = max(R_GPU, R_CPU, R_RAM) × Θ_thermal   (Θ ramps 1.0→max_mult over t_low→t_high)
#   U = 1 - (1 - L̂_avg)(1 - Ĥ_avg)             noisy-OR; both cycle-averaged
#
# Risk trigger: U ≥ risk_threshold → overload onset (replaces load_score threshold
#               when enabled, zero behaviour change when disabled).
# ---------------------------------------------------------------------------
proactive:
  enabled: false          # set true after running fit_coefficients.py
  shadow_mode: true       # emit risk_index telemetry while keeping all decisions
                          # strictly passive/reactive — audit-only side-channel

  # W_base: idle GPU load with an active Zenoh session but zero video sources.
  # Measure with: python3 tools/profile_collect.py --wbase
  w_base: 0.0            # placeholder — replace with measured value

  # Regression coefficients (α₂ = 0.0 if linear model chosen by held-out RMSE)
  alpha1: 0.0             # N_track linear coefficient   — fill after Phase 1
  alpha2: 0.0             # N_track² quadratic coeff     — 0.0 if linear wins
  beta:   0.0             # N_plate coefficient           — fill after Phase 1
  gamma:  0.0             # stationary_fraction coeff     — fill after Phase 1

  # Cycle-aware smoothing window (≈ one full traffic-light cycle)
  cycle_window_s: 6.0

  # Offload trigger threshold on the smoothed risk index U
  risk_threshold: 0.85    # U ≥ this → overload (replaces overload_threshold when enabled)

  # Hardware safety fuse: U ≥ this → force Level-1 migration regardless of L
  hard_fuse_threshold: 0.95

  # Θ_thermal smooth ramp (replaces discrete omega thermal preset)
  theta_thermal:
    t_low:    75.0         # °C — ramp starts here (multiplier = 1.0)
    t_high:   90.0         # °C — ramp ends here   (multiplier = max_mult)
    max_mult: 1.25         # ≈ Jetson thermal throttle factor (~20–25% clock cut)

  # Deep-learning predictor (used when LOAD_MODEL=dl)
  # Training contract (tools/train_fps_forecaster.py):
  #   source_interval_s=0.5  → raw pipeline writes 2 rows/s
  #   sample_interval_s=1.0  → model trained at 1.0s cadence (matches HEALTH_INTERVAL)
  #   history=5               → 5 rows × 1.0s = 5 s lookback
  #   horizons=[6.0, 10.0]   → ONNX outputs [FPS@t+6s, FPS@t+10s]
  #   horizon_index=0        → use first output (t+6s)
  #
  # Feature vector (10 features):
  #   [n_active, n_track, n_plate, stationary, fps_avg, gpu, cpu, ram, gpu_temp, offload_rate]
  dl_model:
    model_path:        ""        # e.g. "models/future_fps_predictor.onnx" — train artifact not yet produced
    window_k:           5        # deployment-side history length (must match trainer's --history)
    sample_interval_s:  1.0      # cadence in seconds (must match HEALTH_INTERVAL + trainer's --sample-interval)
    horizons_s:         [6, 10]  # forecast horizons (must match trainer's --horizons)
    horizon_index:      0        # which horizon to use: 0 = t+6s, 1 = t+10s
