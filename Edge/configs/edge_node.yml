# ============================================================
# edge_node.yml — P2P Orchestration Parameters only
#
# All scalar settings (node_id, fps, max_streams, signaling,
# health interval, etc.) live in Edge/.env — not here.
# This file holds only the structured P2P tuning that cannot
# be expressed as flat key=value pairs.
# ============================================================

p2p:
  overload_threshold: 57.0      # load_score at or above this triggers RFO; L3 anchor
                                   # (22 FPS → score 57) under FPS-dominant piecewise curve
  overload_duration_s: 7.0     # must be overloaded this long before RFO
                                   # slightly exceeds one traffic-light cycle (6s)
                                   # to filter transient GPU bursts with healthy FPS
  cooldown_s: 30.0              # per-camera cooldown between migrations
                                  # prevents ping-pong while allowing rebalancing
                                  # after migration effect is observable
  migration_timeout_s: 15.0    # wait for ADD ack before rollback (restored to safe default;
                                 # 2 s was too tight for slow RTSP sources across LAN)
  heartbeat_timeout_s: 5.0      # peer declared OFFLINE after this silence
  vote_window_s: 2.0            # proposal collection duration
  failover_jitter_max_s: 3.0    # random delay before failover ADD (race prevention)
  reclaim_margin: 15.0          # reclaim only when load < (overload_threshold - reclaim_margin)
                                   # 57 - 15 = 42; enables reclaim once score drops below 42
  reclaim_stable_s: 90.0        # load must stay below reclaim threshold this long before
                                  # reclaiming — one full signal cycle to confirm genuine
                                  # capacity recovery rather than a momentary green phase

  # epsilon-Constraint tiers (Pareto optimization)
  eps_fps_strict: 15.0          # Tier 0 — strict FPS floor
  eps_fps_tier1: 12.0           # Tier 1 relaxation
  eps_fps_tier2: 10.0           # Tier 2 relaxation
  eps_network_ms_strict: 30.0   # Tier 0 — RTSP RTT ceiling
  eps_network_ms_tier1: 60.0    # Tier 1 relaxation
  eps_streams_max: 4            # Hard capacity ceiling (must match max key in fps_model)

  # FPS prediction model — calibrate offline per Jetson model
  # key = number of streams AFTER accepting the new camera
  fps_model:
    1: 30.0
    2: 25.0
    3: 20.5
    4: 15.5

  # ---------------------------------------------------------------------------
  # Multi-level offload (Levels 1–3 from the paper)
  # offload_level: 0 = disabled — bypass ladder, jump straight to Level 1 only
  #                1 = Level 1 only  (full-stream RTSP migration)
  #                2 = Level 2 + 1   (vehicle-crop offload, then stream migration)
  #                3 = Level 3 + 2 + 1 (full escalation ladder — plate → vehicle → stream)
  # The orchestrator escalates automatically: 3 → 2 → 1.
  # Set offload_level: 0 to skip fine-grained offload and go straight to migration.
  # ---------------------------------------------------------------------------
  offload_level: 3

  # Load thresholds that trigger each escalation step
  # Anchors from the FPS-dominant piecewise-linear curve:
  #   avg_fps 22 → score 57  (L3) · avg_fps 19 → score 65 (L2) · avg_fps 17 → score 75 (L1)
  offload_level3_threshold: 57.0   # L3: crop offload → plate-crop offload first
  offload_level2_threshold: 65.0   # L2: vehicle-crop offload when load worsens
  offload_level1_threshold: 75.0   # L1: fall-stream RTSP migration at critical load

  # Cooldown between level changes for the same camera (seconds)
  offload_level_cooldown_s: 12.0

  # TensorRT engine paths used by the offload receiver (Level 2 + 3)
  lpr_engine_path: "models/lpr.engine"
  lpd_engine_path: "models/lpd.engine"

# ---------------------------------------------------------------------------
# Load score — FPS-dominant piecewise-linear curve + hardware emergency floor
#
# FPS score (bounded, input FPS clamped to [0, TARGET_FPS=27]):
#   avg_fps >= 27  →   0
#   avg_fps  = 22  →  57  (L3/overload threshold)
#   avg_fps  = 19  →  65  (L2)
#   avg_fps  = 17  →  75  (L1)
#   avg_fps <=  0  → 100
#   Linear interpolation between anchors.
#
# Hardware emergency floor:
#   If ANY of {GPU, CPU, RAM} >= hw_fuse_threshold (90):
#       score = max(fps_score, hw_fuse_score_floor) (75.0 = L1)
#   This ensures hardware saturation immediately triggers Level 1 but
#   never falsely reports score 100.
#
# Hardware weights are removed from the score entirely — only the
# anchored FPS curve + floor drive the value.  Hardware metrics are
# safety status, not additive bonuses.
#
# Returns preset = "fps_dominant" every cycle — stable preset string.
# ---------------------------------------------------------------------------
load_score:
  # Anchor points are hardcoded in the piecewise linear function
  # (health_agent._compute_load_score).  This file carries only the
  # tuneable hardware-fuse parameters.

  # Hardware saturation threshold — when ANY single metric (GPU, CPU,
  # or RAM) reaches/exceeds this threshold, the emergency floor activates.
  hw_fuse_threshold: 90.0

  # Emergency floor — score cannot drop below this while any hardware
  # metric is saturated.  Set to 75.0 (L1 threshold) so hardware crisis
  # immediately triggers full-stream migration (L1) but not 100.
  hw_fuse_score_floor: 75.0

# ---------------------------------------------------------------------------
# Proactive load model — Vehicle-Driven Proactive Load Profiling
#
# Coefficients are fitted offline by tools/fit_coefficients.py on data
# collected from the target Jetson via tools/profile_collect.py.
#
# Workflow:
#   1. Measure W_base:
#        python3 tools/profile_collect.py --wbase --wbase-output logs/wbase.txt
#   2. Collect calibration data (10 min, varying traffic density):
#        python3 tools/profile_collect.py --output logs/calibration.csv \
#                --wbase-ref <W_base from step 1>
#   3. Fit coefficients:
#        python3 tools/fit_coefficients.py --csv logs/calibration.csv \
#                --wbase <W_base> --output configs/edge_node.yml
#   4. Set enabled: true and restart.
#
# Formula (L_proactive normalised to [0,1]):
#   L = (W_base + Σ_cam[α₁·N_track + α₂·N_track² + β·N_plate + γ·S]) / 100
#   H = max(R_GPU, R_CPU, R_RAM) × Θ_thermal   (Θ ramps 1.0→max_mult over t_low→t_high)
#   U = 1 - (1 - L̂_avg)(1 - Ĥ_avg)             noisy-OR; both cycle-averaged
#
# Risk trigger: U ≥ risk_threshold → overload onset (replaces load_score threshold
#               when enabled, zero behaviour change when disabled).
# ---------------------------------------------------------------------------
proactive:
  enabled: false          # set true after running fit_coefficients.py
  shadow_mode: true       # emit risk_index telemetry while keeping all decisions
                          # strictly passive/reactive — audit-only side-channel

  # W_base: idle GPU load with an active Zenoh session but zero video sources.
  # Measure with: python3 tools/profile_collect.py --wbase
  w_base: 0.0            # placeholder — replace with measured value

  # Regression coefficients (α₂ = 0.0 if linear model chosen by held-out RMSE)
  alpha1: 0.0             # N_track linear coefficient   — fill after Phase 1
  alpha2: 0.0             # N_track² quadratic coeff     — 0.0 if linear wins
  beta:   0.0             # N_plate coefficient           — fill after Phase 1
  gamma:  0.0             # stationary_fraction coeff     — fill after Phase 1

  # Cycle-aware smoothing window (≈ one full traffic-light cycle)
  cycle_window_s: 6.0     # must match dl_model.horizon_s

  # Offload trigger threshold on the smoothed risk index U
  risk_threshold: 0.85    # U ≥ this → overload (replaces overload_threshold when enabled)

  # Hardware safety fuse: U ≥ this → force Level-1 migration regardless of L
  hard_fuse_threshold: 0.95

  # Θ_thermal smooth ramp (replaces discrete omega thermal preset)
  theta_thermal:
    t_low:    75.0         # °C — ramp starts here (multiplier = 1.0)
    t_high:   90.0         # °C — ramp ends here   (multiplier = max_mult)
    max_mult: 1.25         # ≈ Jetson thermal throttle factor (~20–25% clock cut)

  # Deep-learning predictor (used when LOAD_MODEL=dl)
  dl_model:
    model_path: "models/load_predictor.onnx"
    window_k: 5            # number of past feature windows in one input sample
    horizon_s: 6           # must match train_dl_model.py --horizon-rows × HEALTH_INTERVAL
