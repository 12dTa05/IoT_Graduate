# ============================================================
# edge_node.yml — P2P Orchestration Parameters only
#
# All scalar settings (node_id, fps, max_streams, signaling,
# health interval, etc.) live in Edge/.env — not here.
# This file holds only the structured P2P tuning that cannot
# be expressed as flat key=value pairs.
# ============================================================

p2p:
  overload_threshold: 75.0      # load_score above this triggers RFO
  overload_duration_s: 10.0     # must be overloaded this long before RFO
  cooldown_s: 45.0              # per-camera cooldown between migrations
  migration_timeout_s: 15.0     # wait for ADD ack before rollback
  heartbeat_timeout_s: 6.0      # peer declared OFFLINE after this silence
  vote_window_s: 3.0            # proposal collection duration
  failover_jitter_max_s: 2.0    # random delay before failover ADD (race prevention)

  # epsilon-Constraint tiers (Pareto optimization)
  eps_fps_strict: 18.0          # Tier 0 — strict FPS floor
  eps_fps_tier1: 15.0           # Tier 1 relaxation
  eps_fps_tier2: 12.0           # Tier 2 relaxation
  eps_network_ms_strict: 50.0   # Tier 0 — RTSP RTT ceiling
  eps_network_ms_tier1: 80.0    # Tier 1 relaxation
  eps_streams_max: 8            # Hard capacity ceiling (matches cameras.yml max_streams)

  # FPS prediction model — calibrate offline per Jetson model
  # key = number of streams AFTER accepting the new camera
  fps_model:
    1: 24.5
    2: 22.0
    3: 18.5
    4: 14.5

