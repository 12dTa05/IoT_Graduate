<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Graduate — Grid Monitor</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh; overflow: hidden;
}
#toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: #1a1a24;
  border-bottom: 1px solid #2a2a3a;
}
#toolbar h1 { font-size: 16px; font-weight: 600; color: #7c7cff; }
#status { font-size: 12px; color: #888; }
#status.online { color: #4caf50; }
#status.error  { color: #f44336; }
#status.warning { color: #ff9800; }
#grid-container {
  display: grid;
  gap: 4px;
  padding: 4px;
  height: calc(100vh - 42px);
  background: #0a0a0f;
}
.cell {
  position: relative;
  background: #14141e;
  border-radius: 6px;
  overflow: hidden;
  min-height: 120px;
}
.cell video {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.cell .label {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 4px 8px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  font-size: 12px; color: #fff;
  pointer-events: none;
}
.cell .placeholder {
  display: flex; align-items: center; justify-content: center;
  height: 100%;
  color: #444; font-size: 14px;
}
.cell .connecting {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ff9800;
  animation: pulse 1s infinite;
}
.cell .connected-dot {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #4caf50;
}
.cell .disconnected-dot {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #f44336;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
.grid-1  { grid-template-columns: 1fr; }
.grid-2  { grid-template-columns: 1fr 1fr; }
.grid-3  { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.grid-3 > .cell:first-child { grid-column: 1 / -1; }
.grid-4  { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.grid-5,
.grid-6  { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
.grid-7,
.grid-8  { grid-template-columns: 1fr 1fr 1fr; }
.grid-9  { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
</style>
</head>
<body>
<div id="toolbar">
  <h1>IoT Graduate Grid Monitor</h1>
  <span id="status">Disconnected</span>
</div>
<div id="grid-container"></div>

<script>
// ── Configuration ──────────────────────────────────────────────
const MQTT_WS_URL  = `ws://${location.hostname}:9001/mqtt`;
const GRID_EL      = document.getElementById('grid-container');
const STATUS_EL    = document.getElementById('status');

// ── State ──────────────────────────────────────────────────────
const cameras = new Map();  // camera_id → { node_id, jetson_ip, signaling_port, element, pc, ws }
let reconnectTimer = null;

// ── Helpers ────────────────────────────────────────────────────

function setStatus(text, cls) {
  STATUS_EL.textContent = text;
  STATUS_EL.className = cls || '';
}

function computeGridClass(n) {
  if (n <= 1) return 'grid-1';
  if (n === 2) return 'grid-2';
  if (n <= 4) return 'grid-4';
  if (n <= 6) return 'grid-6';
  return 'grid-9';
}

function updateGridLayout() {
  const n = cameras.size;
  GRID_EL.className = computeGridClass(n);
}

// ── WebRTC: Connect to a single camera ─────────────────────────

async function connectWebRTC(cameraId, nodeId, jetsonIp, port) {
  const existing = cameras.get(cameraId);
  if (existing && existing.nodeId === nodeId && existing.pc) {
    return; // Already connected to the same node
  }

  // If camera exists but belongs to different node: Make phase (background)
  // Store the NEW connection info while keeping old one playing
  const wsUrl = `ws://${jetsonIp}:${port}/ws?role=browser&target_edge=${nodeId}`;

  // Create cell if first time
  let cell;
  if (!existing) {
    cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = `cell-${cameraId}`;

    const placeholder = document.createElement('div');
    placeholder.className = 'placeholder';
    placeholder.textContent = cameraId;
    cell.appendChild(placeholder);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = cameraId;
    cell.appendChild(label);

    const dot = document.createElement('div');
    dot.className = 'connecting';
    cell.appendChild(dot);

    GRID_EL.appendChild(cell);
  } else {
    cell = existing.element;
    // Update label
    cell.querySelector('.label').textContent = cameraId;

    // If this is a migration (different node): replace old cell content
    // Keep the cell, we'll swap the video track
    if (existing.nodeId !== nodeId) {
      const dot = cell.querySelector('.connecting, .connected-dot, .disconnected-dot');
      if (dot) dot.className = 'connecting';
    } else {
      return; // Same node, nothing to do
    }
  }

  // Set state to connecting
  const entry = {
    cameraId, nodeId, jetsonIp, port, element: cell,
    pc: null, ws: null,
    cleanup: () => {
      if (entry.pc) { try { entry.pc.close(); } catch(e) {} entry.pc = null; }
      if (entry.ws) { try { entry.ws.close(); } catch(e) {} entry.ws = null; }
    }
  };
  cameras.set(cameraId, entry);

  // Track if this was a migration (we already had a previous connection)
  const isMigration = existing && existing.nodeId !== nodeId;

  try {
    const ws = new WebSocket(wsUrl);
    entry.ws = ws;

    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    entry.pc = pc;

    // When remote track arrives: render it
    pc.ontrack = (event) => {
      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      video.srcObject = event.streams[0];

      // Remove placeholder or old video
      const oldVideo = cell.querySelector('video');
      const placeholder = cell.querySelector('.placeholder');
      if (oldVideo) oldVideo.remove();
      if (placeholder) placeholder.remove();

      cell.insertBefore(video, cell.querySelector('.label'));

      // Update dot
      const dot = cell.querySelector('.connecting');
      if (dot) dot.className = 'connected-dot';

      // Break phase: if this was a migration, close old connection after 10s
      if (isMigration && existing) {
        setTimeout(() => {
          existing.cleanup();
          // Remove old entry if it still exists and is different
          const current = cameras.get(cameraId);
          if (current && current.nodeId === nodeId && current !== existing) {
            // old one is gone, good
          }
        }, 10000);
      }
    };

    pc.oniceconnectionstatechange = () => {
      if (pc.iceConnectionState === 'disconnected' ||
          pc.iceConnectionState === 'failed') {
        const dot = cell.querySelector('.connected-dot, .connecting');
        if (dot) dot.className = 'disconnected-dot';
      }
    };

    ws.onopen = async () => {
      // Send SDP Offer
      const offer = await pc.createOffer({ offerToReceiveVideo: true });
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({
        type: 'offer',
        sdp: pc.localDescription.sdp,
        action: 'view',
        target_edge: nodeId,
      }));
    };

    ws.onmessage = async (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'answer' && msg.sdp) {
          await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
        } else if (msg.type === 'ice' && msg.candidate) {
          await pc.addIceCandidate(msg.candidate);
        }
      } catch(e) {
        console.warn('[WS msg error]', e);
      }
    };

    ws.onclose = () => {
      // Will be reconnected on next heartbeat
    };

    ws.onerror = () => {};

  } catch(e) {
    console.error(`[WebRTC] Error connecting ${cameraId}:`, e);
    const dot = cell.querySelector('.connecting');
    if (dot) dot.className = 'disconnected-dot';
  }
}

// ── MQTT: Subscribe to peers/status/+ ───────────────────────────

function connectMQTT() {
  if (reconnectTimer) clearTimeout(reconnectTimer);

  setStatus('Connecting...', 'warning');

  const client = mqtt.connect(MQTT_WS_URL, {
    clientId: `grid_monitor_${Math.random().toString(36).slice(2, 8)}`,
    clean: true,
    connectTimeout: 5000,
  });

  client.on('connect', () => {
    setStatus('Connected', 'online');
    client.subscribe('peers/status/+', { qos: 1 });
    console.log('[MQTT] Connected, subscribed to peers/status/+');
  });

  client.on('message', (topic, payload) => {
    try {
      const msg = JSON.parse(payload.toString());
      const nodeId = msg.node_id;
      const pipeline = msg.pipeline || {};
      const activeCams = pipeline.active_cameras || [];
      const signalingPort = msg.signaling_port || 8080;
      const jetsonIp = window.location.hostname; // same LAN

      // Get peer IP from heartbeat (we know the broker knows, but we need
      // the actual Jetson IP to connect WebRTC directly).
      // For now, we assume same hostname. In production, peer IPs should
      // be discovered via mDNS or configured statically.
      // The signaling_server.py doesn't expose IP in heartbeats yet,
      // so we derive it: if it's localhost, use hostname; otherwise
      // the peer IP must be in the topic or payload.
      // WORKAROUND: peer IP = broker IP (all on same LAN)
      // TODO: Add "ip" field to health_agent.py heartbeat
      const peerIp = msg.ip || jetsonIp;

      // Build current camera map from all heartbeats
      const currentCameras = new Map();

      // We receive individual heartbeats. Track camera → node mapping.
      // Store the latest node for each camera
      for (const camId of activeCams) {
        const existing = cameras.get(camId);
        if (existing && existing.nodeId !== nodeId) {
          // Camera moved — will be handled by connectWebRTC's migration logic
          console.log(`[Grid] Camera '${camId}' moved: ${existing.nodeId} → ${nodeId}`);
        }
        currentCameras.set(camId, { nodeId, ip: peerIp, port: signalingPort });
      }

      // Connect/update each camera
      for (const [camId, info] of currentCameras) {
        connectWebRTC(camId, info.nodeId, info.ip, info.port);
      }

      // Remove cameras that are no longer active on ANY peer
      // (We'd need to merge all peers' active lists — simplified here:
      //  just add new cameras, WebRTC timeout handles stale ones)
      updateGridLayout();

    } catch(e) {
      console.error('[MQTT message error]', e);
    }
  });

  client.on('error', (err) => {
    setStatus(`Error: ${err.message}`, 'error');
    reconnectTimer = setTimeout(connectMQTT, 5000);
  });

  client.on('close', () => {
    if (!client._reconnecting) {
      setStatus('Disconnected. Reconnecting...', 'warning');
      reconnectTimer = setTimeout(connectMQTT, 5000);
    }
  });
}

// ── Start ──────────────────────────────────────────────────────

connectMQTT();
</script>
</body>
</html>
