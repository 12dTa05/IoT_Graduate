# MediaMTX — Centralized RTSP→WebRTC relay for IoT Graduate
#
# Edge nodes push RTSP streams here.
# Browser clients consume via WebRTC (WHEP protocol).

# ── Logging ──────────────────────────────────────────────────
logLevel: debug
logDestinations: [stdout]

# ── RTSP server (receives push from Edge nodes) ─────────────
rtsp: yes
rtspAddress: 0.0.0.0:8554
# TCP only — avoids UDP packet loss on the WAN link from Jetson→VPS
protocols: [tcp]
# Larger read buffer absorbs WAN jitter without dropping frames.
# 2048 packets × ~1400 bytes ≈ ~2.8 MB buffer per stream
readBufferCount: 2048

# ── WebRTC server (serves to browser via WHEP) ──────────────
webrtc: yes
webrtcAddress: 0.0.0.0:8889
# Static UDP port for ICE traffic to simplify firewall rules and routing
webrtcICEUDPMuxAddress: 0.0.0.0:8189
# CRITICAL: tells MediaMTX to include the public IP in ICE candidates
# Without this, ICE candidates only contain Docker/private IPs and
# external browsers cannot connect via WebRTC.
# Configured via docker-compose.media.yml (MTX_WEBRTCICEHOSTNAT1TO1IPS / MEDIAMTX_PUBLIC_IP).
# Optional fallback if run directly without env:
webrtcICEHostNAT1To1IPs: []

# ── API server (query active streams) ───────────────────────
api: yes
apiAddress: 0.0.0.0:9997

# ── HLS (low-latency fallback for browsers where WebRTC fails)
hls: yes
hlsAddress: 0.0.0.0:8888
# 3 segments × 500ms = 1.5s DVR window — minimal latency
hlsSegmentCount: 3
hlsSegmentDuration: 500ms

# ── RTMP (not needed) ───────────────────────────────────────
rtmp: no

# ── Stream paths ────────────────────────────────────────────
# Accept any stream path pushed by Edge nodes (e.g., /jetson_A, /jetson_B)
paths:
  all_others:
    source: publisher
    # Reject a second simultaneous publisher for the same camera path during migration overlap.
    # The new receiver must take over cleanly only after the prior sender has torn down its sink.
    overridePublisher: no
    # If the Edge disconnects, wait up to 10s before dropping WebRTC viewers.
    # This absorbs brief WAN hiccups without forcing browser reconnects.
    sourceOnDemandCloseAfter: 10s
