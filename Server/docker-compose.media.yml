version: "3.8"
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    # mediamtx is a static binary with no shell/curl/wget/nc inside.
    # Use NONE to disable the broken healthcheck; the service is
    # confirmed working via the host-side API at port 9997.
    healthcheck:
      disable: true
