<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Graduate — Central Monitor</title>
<!-- SERVER_CONFIG -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

/* ── Toolbar ───────────────────────────────────────────── */
#toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: #1a1a24;
  border-bottom: 1px solid #2a2a3a;
  position: relative; z-index: 100;
}
#toolbar h1 { font-size: 16px; font-weight: 600; color: #7c7cff; white-space: nowrap; }

#cluster-nav { display: flex; align-items: center; gap: 6px; }
#cluster-nav button {
  background: #2a2a3a; border: none; color: #ccc;
  font-size: 14px; padding: 2px 8px; border-radius: 4px;
  cursor: pointer; line-height: 1.4;
}
#cluster-nav button:hover { background: #3a3a4a; }
#cluster-nav button:disabled { opacity: 0.3; cursor: default; }
#cluster-title { font-size: 13px; font-weight: 500; color: #e0e0e0; min-width: 80px; text-align: center; }

.badge { font-size: 11px; padding: 2px 10px; border-radius: 10px; background: #2a2a3a; white-space: nowrap; }
.badge.online { color: #4caf50; background: #1a3a1a; }
.badge.offline { color: #f44336; background: #3a1a1a; }
#status { font-size: 11px; color: #888; margin-left: auto; white-space: nowrap; }
#status.online { color: #4caf50; }
#status.error { color: #f44336; }

/* ── Main layout ──────────────────────────────────────── */
#main {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 8px;
  padding: 8px;
  overflow: hidden;
  min-height: 0;
}

/* ── Video panel ──────────────────────────────────────── */
#video-panel {
  background: #14141e;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
#video-grid {
  flex: 1;
  display: grid;
  gap: 4px;
  padding: 8px;
  min-height: 0;
}
.video-cell {
  background: #000;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-cell video {
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
}
.video-cell .label {
  position: absolute; top: 6px; left: 8px;
  font-size: 11px; font-weight: 600;
  color: #fff; background: rgba(0,0,0,0.65);
  padding: 2px 8px; border-radius: 4px;
  z-index: 2;
}
.video-cell .status-badge {
  position: absolute; bottom: 6px; right: 8px;
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  z-index: 2;
}
.video-cell .status-badge.connecting { background: #ff9800; color: #000; }
.video-cell .status-badge.live { background: #4caf50; color: #fff; }
.video-cell .status-badge.error { background: #f44336; color: #fff; }
.video-cell .bitrate-badge {
  position: absolute; bottom: 6px; left: 8px;
  font-size: 10px; color: #aaa; background: rgba(0,0,0,0.65);
  padding: 1px 6px; border-radius: 3px;
  z-index: 2;
}
.video-cell .no-stream {
  color: #555; font-size: 13px;
}

/* ── Cluster dots ─────────────────────────────────────── */
#cluster-dots {
  display: flex; justify-content: center; gap: 6px;
  padding: 6px 0 8px;
}
#cluster-dots .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #3a3a4a; cursor: pointer;
  transition: background 0.2s;
}
#cluster-dots .dot.active { background: #7c7cff; }
#cluster-dots .dot:hover { background: #5a5a6a; }

/* ── Sidebar ──────────────────────────────────────────── */
#sidebar {
  display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto;
  min-height: 0;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }

.health-card {
  background: #1a1a28;
  border-radius: 6px;
  padding: 10px 12px;
  border-left: 3px solid #4caf50;
  flex-shrink: 0;
}
.health-card.offline { border-left-color: #555; opacity: 0.6; }
.health-card .header {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.health-card .dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.health-card .dot.online { background: #4caf50; }
.health-card .dot.offline { background: #555; }
.health-card .node-id { font-weight: 600; font-size: 12px; }
.health-card .ip { font-size: 10px; color: #888; margin-left: auto; }

.metric-row {
  display: flex; align-items: center; gap: 6px;
  margin-top: 3px;
  font-size: 11px;
}
.metric-row .metric-label { color: #aaa; min-width: 28px; text-align: right; font-size: 10px; }
.metric-bar {
  flex: 1; height: 6px; background: #2a2a3a; border-radius: 3px;
  overflow: hidden;
}
.metric-bar .bar-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.4s ease;
  background: #4caf50;
}
.metric-bar .bar-fill.warn { background: #ff9800; }
.metric-bar .bar-fill.crit { background: #f44336; }
.metric-row .metric-value { min-width: 36px; text-align: right; font-size: 10px; color: #e0e0e0; }

.metric-row.compact { margin-top: 1px; }
.metric-row.compact .metric-value { min-width: 50px; }
.fps-row {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 4px; font-size: 10px; color: #888;
}
.fps-row span { background: #14141e; padding: 1px 6px; border-radius: 3px; }

/* ── Violation strip ──────────────────────────────────── */
#violation-strip {
  background: #14141e;
  border-top: 1px solid #2a2a3a;
  display: flex; flex-direction: column;
  max-height: 140px;
}
#violation-header {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 16px;
  font-size: 12px; font-weight: 600;
  color: #7c7cff;
  border-bottom: 1px solid #1a1a28;
  flex-shrink: 0;
}
#violation-filters { display: flex; align-items: center; gap: 6px; margin-left: auto; }
#violation-filters input, #violation-filters select {
  background: #1a1a28; border: 1px solid #2a2a3a; color: #e0e0e0;
  padding: 2px 8px; border-radius: 4px; font-size: 11px;
}
#violation-filters button {
  background: #2a2a3a; border: none; color: #ccc;
  padding: 2px 10px; border-radius: 4px; font-size: 11px;
  cursor: pointer;
}
#violation-filters button:hover { background: #3a3a4a; }
#violation-count { color: #e0e0e0; }

#violation-list {
  display: flex; gap: 6px;
  padding: 4px 16px;
  overflow-x: auto;
  overflow-y: hidden;
  flex: 1;
  align-items: stretch;
}
#violation-list::-webkit-scrollbar { height: 4px; }
#violation-list::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }

.violation-card {
  display: flex; flex-direction: column;
  gap: 2px;
  background: #1a1a28;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px;
  min-width: 180px;
  max-width: 220px;
  flex-shrink: 0;
  border-left: 3px solid #f44336;
  cursor: pointer;
  transition: background 0.2s;
}
.violation-card:hover { background: #22223a; }
.violation-card .v-time { color: #888; font-size: 10px; }
.violation-card .v-detail { display: flex; align-items: center; gap: 6px; }
.violation-card .v-node { color: #7c7cff; font-weight: 600; }
.violation-card .v-plate { color: #ff9800; font-weight: 600; }
.violation-card .v-speed { color: #f44336; font-weight: 600; }
.violation-card .v-thumb {
  width: 32px; height: 24px; border-radius: 3px;
  object-fit: cover; margin-left: auto;
}
.violation-empty {
  color: #555; font-size: 12px;
  display: flex; align-items: center; padding: 0 16px;
}

/* ── Modal ────────────────────────────────────────────── */
#modal-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  justify-content: center; align-items: center;
}
#modal-overlay.open { display: flex; }
#modal-overlay img {
  max-width: 90vw; max-height: 90vh;
  border-radius: 8px;
}
#modal-overlay .close {
  position: absolute; top: 20px; right: 30px;
  font-size: 28px; color: #fff; cursor: pointer;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a0f; }
::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>Central Monitor</h1>
  <div id="cluster-nav">
    <button id="prev-cluster" disabled>&larr;</button>
    <span id="cluster-title">Cluster</span>
    <button id="next-cluster" disabled>&rarr;</button>
  </div>
  <span class="badge" id="edge-count-badge">0 edges</span>
  <span class="badge" id="stream-count-badge" style="color:#4fc3f7;background:#1a2a3a;">0 streams</span>
  <span id="status">Connecting...</span>
</div>

<div id="main">
  <div id="video-panel">
    <div id="video-grid">
      <div class="video-cell"><span class="no-stream">No streams available</span></div>
    </div>
    <div id="cluster-dots"></div>
  </div>
  <div id="sidebar"></div>
</div>

  <div id="violation-header">
    <span>Violations (<span id="violation-count">0</span>)</span>
    <div id="violation-filters">
      <input type="date" id="filter-date">
      <select id="filter-node"><option value="">All nodes</option></select>
      <button id="filter-apply">Filter</button>

  <div id="violation-list">

  <span class="close">&times;</span>
  <img id="modal-img" src="" alt="snapshot">
</div>

<script>
(function () {

// ── Config ────────────────────────────────────────────────────
const CONFIG = (() => {
  try {
    const el = document.getElementById('server-config');
    if (el) return JSON.parse(el.textContent);
  } catch(e) {}
  return {
    MEDIAMTX_API: '/api/streams',
    MEDIAMTX_WEBRTC_URL: `http://${location.hostname}:8889`,
    WS_URL: `ws://${location.host}/ws/server`,
  };
})();

const MEDIAMTX_WEBRTC_BASE = CONFIG.MEDIAMTX_WEBRTC_URL || `http://${location.hostname}:8889`;
const WS_URL = CONFIG.WS_URL || `ws://${location.host}/ws/server`;

// ── DOM refs ─────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const TOOLBAR = $('toolbar');
const CLUSTER_TITLE = $('cluster-title');
const PREV_BTN = $('prev-cluster');
const NEXT_BTN = $('next-cluster');
const CLUSTER_DOTS = $('cluster-dots');
const EDGE_BADGE = $('edge-count-badge');
const STREAM_BADGE = $('stream-count-badge');
const STATUS = $('status');
const VIDEO_GRID = $('video-grid');
const SIDEBAR = $('sidebar');
const VIOLATIONS_HEADER_COUNT = $('violation-count');
const VIOLATION_LIST = $('violation-list');
const MODAL = $('modal-overlay');
const MODAL_IMG = $('modal-img');
const FILTER_DATE = $('filter-date');
const FILTER_NODE = $('filter-node');
const FILTER_APPLY = $('filter-apply');

// ── State ────────────────────────────────────────────────────
const edges = {};          // node_id -> edge dict (from server)
const violations = [];     // newest first, max 200
const streamStates = {};   // streamName -> { pc, video, cell, connecting, reconnectTimer, statsTimer, bitrate }

let clusters = [];         // [{ id, edges: [...] }]
let mediaMtxStreamNames = [];  // stream names from MediaMTX (pollStreams)
let currentClusterIdx = 0;
let streamPollTimer = null;
let ws = null;
let reconnectTimer = null;
let wsPingTimer = null;

// ── Format helpers ──────────────────────────────────────────
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString();
}
function fmtPct(v) { return v != null ? `${v.toFixed(1)}%` : '--'; }
function fmtTemp(v) { return v != null ? `${v.toFixed(1)}\u00B0C` : '--'; }
// When the jtop daemon is unavailable on an edge, GPU%, Temp (and all other
// metrics) are reported as 0.0 — indistinguishable from a real zero reading.
// The health payload sets "source":"jtop_unavailable" in that case; use it to
// show "N/A" so users know the metric is unavailable rather than actually 0.
function fmtGpuPct(v, source) {
  if (source === 'jtop_unavailable') return 'N/A';
  return v != null ? `${v.toFixed(1)}%` : '--';
}
function fmtGpuTemp(v, source) {
  if (source === 'jtop_unavailable') return 'N/A';
  return v != null ? `${v.toFixed(1)}\u00B0C` : '--';
}
function fmtBitrate(bps) {
  if (!bps || bps <= 0) return '';
  if (bps > 1e6) return `${(bps / 1e6).toFixed(1)} Mbps`;
  return `${Math.round(bps / 1000)} kbps`;
}
function fmtDate(d) {
  return d.toISOString().slice(0, 10);
}

// ── Cluster grouping ────────────────────────────────────────
function getClusterId(edge) {
  if (edge.cluster_id && edge.cluster_id !== 'default') return edge.cluster_id;
  const ip = edge.ip || '';
  const parts = ip.split('.');
  if (parts.length >= 3) return parts.slice(0, 3).join('.');
  return 'default';
}

function rebuildClusters() {
  const groups = {};
  for (const edge of Object.values(edges)) {
    const cid = getClusterId(edge);
    if (!groups[cid]) groups[cid] = [];
    groups[cid].push(edge);
  }
  const keys = Object.keys(groups).sort();
  clusters = keys.map((id) => ({ id: id === 'default' ? 'cluster' : `Cluster ${keys.indexOf(id) + 1}`, displayId: id, edges: groups[id] }));
  if (currentClusterIdx >= clusters.length) currentClusterIdx = Math.max(0, clusters.length - 1);
}

function getCurrentCluster() {
  return clusters[currentClusterIdx] || null;
}

function getStreamNamesForCluster(clusterEdges) {
  const names = [];
  for (const edge of clusterEdges) {
    if (!edge.online) continue;
    // One box per edge node: stream name = node_id (e.g. "jetson_A").
    // The Jetson pushes its analyzed composite stream under that key.
    names.push(edge.node_id);
  }
  return names;
}

// ── Grid layout computation ─────────────────────────────────
function computeGridLayout(n, containerW, containerH) {
  if (n <= 0) return { cols: 1, rows: 1 };
  const GAP = 4;
  let best = { cols: 1, rows: n, cellSize: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const cellW = (containerW - GAP * (cols - 1)) / cols;
    const cellH = (containerH - GAP * (rows - 1)) / rows;
    const cellSize = Math.min(cellW, cellH);
    if (cellSize > best.cellSize) {
      best = { cols, rows, cellSize };
    }
  }
  return best;
}

// ── WHEP Player ─────────────────────────────────────────────
async function startWhepPlayer(streamName, videoEl, onStats) {
  const whepUrl = `${MEDIAMTX_WEBRTC_BASE}/${streamName}/whep`;
  let pc;
  try {
    pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
  } catch(e) {
    return null;
  }

  pc.addTransceiver('video', { direction: 'recvonly' });

  pc.ontrack = (evt) => {
    if (evt.track.kind === 'video' && videoEl) {
      videoEl.srcObject = evt.streams[0];
      // Update status badge to "live" once media flows
      const cell = videoEl.parentElement;
      if (cell) {
        const badge = cell.querySelector('.status-badge');
        if (badge) { badge.className = 'status-badge live'; badge.textContent = 'Live'; }
      }
    }
  };

  let offer;
  try {
    offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
  } catch(e) {
    pc.close();
    return null;
  }

  // Send immediately — do NOT wait for local ICE gathering to complete.
  // MediaMTX includes all server-side ICE candidates (public IP) directly in
  // the SDP answer, so the browser can start connectivity checks right away
  // without needing to finish its own gathering first.
  try {
    const resp = await fetch(whepUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });
    if (!resp.ok) {
      pc.close();
      return null;
    }
    const answerSdp = await resp.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  } catch(e) {
    pc.close();
    return null;
  }

  // Connection state monitoring for reconnection
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'failed' || s === 'disconnected') {
      const st = streamStates[streamName];
      if (st && st.pc === pc) {
        scheduleStreamReconnect(streamName);
      }
    }
  };

  // Stats polling
  if (onStats) {
    const interval = setInterval(async () => {
      try {
        if (pc.connectionState !== 'connected') return;
        const stats = await pc.getStats();
        let bitrate = 0;
        stats.forEach((report) => {
          if (report.type === 'inbound-rtp' && report.kind === 'video' && report.bytesReceived) {
            if (pc._lastBytes && pc._lastTime) {
              const dt = (report.timestamp - pc._lastTime) / 1000;
              if (dt > 0) {
                bitrate = 8 * (report.bytesReceived - pc._lastBytes) / dt;
              }
            }
            pc._lastBytes = report.bytesReceived;
            pc._lastTime = report.timestamp;
          }
        });
        const st = streamStates[streamName];
        if (st) st.bitrate = bitrate;
        if (onStats) onStats(bitrate);
      } catch(e) {}
    }, 2000);
    pc._statsInterval = interval;
  }

  return pc;
}

function cleanupStream(name) {
  const st = streamStates[name];
  if (!st) return;
  if (st.reconnectTimer) { clearTimeout(st.reconnectTimer); st.reconnectTimer = null; }
  if (st.pc) {
    if (st.pc._statsInterval) clearInterval(st.pc._statsInterval);
    st.pc.onconnectionstatechange = null;
    st.pc.close();
    st.pc = null;
  }
  st.connecting = false;
  st.connected = false;
}

function scheduleStreamReconnect(name) {
  const st = streamStates[name];
  if (!st) return;
  cleanupStream(name);
  st.reconnectTimer = setTimeout(() => {
    if (streamStates[name] && !streamStates[name].pc) {
      streamStates[name].connecting = false;
      tryConnectStream(name);
    }
  }, 3000);
}

async function tryConnectStream(name) {
  const st = streamStates[name];
  if (!st || !st.video || st.connecting) return;
  st.connecting = true;
  if (st.video.parentElement) {
    const badge = st.video.parentElement.querySelector('.status-badge');
    if (badge) { badge.textContent = 'Connecting...'; badge.className = 'status-badge connecting'; }
  }
  const pc = await startWhepPlayer(name, st.video, (bitrate) => {
    const cell = streamStates[name] && streamStates[name].cell;
    if (cell) {
      const el = cell.querySelector('.bitrate-badge');
      if (el) el.textContent = fmtBitrate(bitrate);
    }
  });
  st.connecting = false;
  if (pc) {
    st.pc = pc;
    st.connected = true;
    if (st.cell) {
      const badge = st.cell.querySelector('.status-badge');
      if (badge) { badge.textContent = 'Live'; badge.className = 'status-badge live'; }
    }
  } else {
    if (st.cell) {
      const badge = st.cell.querySelector('.status-badge');
      if (badge) { badge.textContent = 'Error'; badge.className = 'status-badge error'; }
    }
    scheduleStreamReconnect(name);
  }
}

// ── Render: Video grid ──────────────────────────────────────
function renderVideoGrid() {
  const cluster = getCurrentCluster();
  let streamNames = [];
  if (cluster) {
    // Only show one video box per registered edge node.
    // Raw per-camera streams (cam_01, cam_02, …) pushed by zenoh_gateway
    // are intentionally excluded — they are intermediate streams, not the
    // analyzed output. The edge node pushes its analyzed stream under its
    // own node_id (e.g. "jetson_A").
    streamNames = getStreamNamesForCluster(cluster.edges);
  }

  // Clean up streams not in current cluster
  for (const name of Object.keys(streamStates)) {
    if (!streamNames.includes(name)) {
      cleanupStream(name);
      delete streamStates[name];
    }
  }

  // Add new streams
  for (const name of streamNames) {
    if (!streamStates[name]) {
      streamStates[name] = { pc: null, video: null, cell: null, connecting: false, reconnectTimer: null, statsTimer: null, bitrate: 0, connected: false };
    }
  }

  const n = streamNames.length;

  STREAM_BADGE.textContent = `${n} streams`;

  if (n === 0) {
    VIDEO_GRID.innerHTML = '<div class="video-cell"><span class="no-stream">No streams available</span></div>';
    return;
  }

  // Compute grid dimensions from container size
  const containerW = VIDEO_GRID.clientWidth;
  const containerH = VIDEO_GRID.clientHeight;
  const layout = computeGridLayout(n, containerW, containerH);

  VIDEO_GRID.style.gridTemplateColumns = `repeat(${layout.cols}, 1fr)`;
  VIDEO_GRID.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;

  // Rebuild cells if structure changed
  const existingNames = Array.from(VIDEO_GRID.querySelectorAll('.video-cell'))
    .map(el => el.dataset.stream);
  const needsRebuild = streamNames.length !== existingNames.length ||
    streamNames.some((n, i) => n !== existingNames[i]);

  if (needsRebuild) {
    VIDEO_GRID.innerHTML = '';
    for (const name of streamNames) {
      const cell = document.createElement('div');
      cell.className = 'video-cell';
      cell.dataset.stream = name;

      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      cell.appendChild(video);

      const label = document.createElement('div');
      label.className = 'label';
      label.dataset.nodeId = name;
      // Show node_id + active camera count if known
      const edgeInfo = edges[name];
      const activeCams = edgeInfo && edgeInfo.health && edgeInfo.health.pipeline
        ? (edgeInfo.health.pipeline.active_cameras || [])
        : [];
      label.textContent = activeCams.length > 0
        ? `${name} (${activeCams.join(', ')})`
        : name;
      cell.appendChild(label);

      const bitrateBadge = document.createElement('div');
      bitrateBadge.className = 'bitrate-badge';
      cell.appendChild(bitrateBadge);

      const statusBadge = document.createElement('div');
      statusBadge.className = 'status-badge connecting';
      statusBadge.textContent = 'Connecting...';
      cell.appendChild(statusBadge);

      VIDEO_GRID.appendChild(cell);

      streamStates[name].video = video;
      streamStates[name].cell = cell;
    }
  }

  // Start WHEP connections
  for (const name of streamNames) {
    const st = streamStates[name];
    if (!st.pc && !st.connecting) {
      tryConnectStream(name);
    }
  }
}

// ── Render: Health sidebar (DOM-diff update) ────────────────
function ensureSidebarCards(clusterEdges) {
  const existing = {};
  for (const card of SIDEBAR.querySelectorAll('.health-card')) {
    existing[card.dataset.nodeId] = card;
  }

  const neededIds = new Set(clusterEdges.map(e => e.node_id));

  // Remove cards for nodes no longer in cluster
  for (const [nid, card] of Object.entries(existing)) {
    if (!neededIds.has(nid)) card.remove();
  }

  // Add/update cards
  for (const edge of clusterEdges) {
    if (existing[edge.node_id]) {
      updateSidebarCard(existing[edge.node_id], edge);
    } else {
      createSidebarCard(edge);
    }
  }

  // Sort cards to match edge order
  const cards = SIDEBAR.querySelectorAll('.health-card');
  const desired = clusterEdges.map(e => e.node_id);
  let idx = 0;
  for (const nid of desired) {
    for (const card of cards) {
      if (card.dataset.nodeId === nid) {
        const target = SIDEBAR.children[idx];
        if (card !== target) SIDEBAR.insertBefore(card, target);
        idx++;
        break;
      }
    }
  }
}

function createSidebarCard(edge) {
  const card = document.createElement('div');
  card.className = `health-card ${edge.online ? '' : 'offline'}`;
  card.dataset.nodeId = edge.node_id;

  card.innerHTML = `
    <div class="header">
      <span class="dot ${edge.online ? 'online' : 'offline'}"></span>
      <span class="node-id">${escHtml(edge.node_id)}</span>
      <span class="ip">${escHtml(edge.ip)}</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">GPU</span>
      <div class="metric-bar"><div class="bar-fill" data-metric="gpu" style="width:0%"></div></div>
      <span class="metric-value" data-metric="gpu-text">--</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">CPU</span>
      <div class="metric-bar"><div class="bar-fill" data-metric="cpu" style="width:0%"></div></div>
      <span class="metric-value" data-metric="cpu-text">--</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">RAM</span>
      <div class="metric-bar"><div class="bar-fill" data-metric="ram" style="width:0%"></div></div>
      <span class="metric-value" data-metric="ram-text">--</span>
    </div>
    <div class="metric-row compact">
      <span class="metric-label" style="color:#aaa;min-width:28px;text-align:right;">Temp</span>
      <span class="metric-value" data-metric="temp-text" style="min-width:50px;">--</span>
      <span style="color:#888;margin-left:auto;">Load</span>
      <span class="metric-value" data-metric="load-text" style="min-width:36px;">--</span>
    </div>
    <div class="fps-row" data-metric="fps-list"></div>
  `;

  SIDEBAR.appendChild(card);
  updateSidebarCard(card, edge);
}

function updateSidebarCard(card, edge) {
  const online = edge.online;
  card.className = `health-card ${online ? '' : 'offline'}`;
  const dot = card.querySelector('.dot');
  if (dot) { dot.className = `dot ${online ? 'online' : 'offline'}`; }

  const h = edge.health || {};
  const pipeline = h.pipeline || {};
  const fps = pipeline.fps_per_camera || {};
  const targetFps = 30;
  const source = h.source || '';   // 'jtop' | 'psutil' | 'error' | ''

  const metrics = [
    { key: 'gpu', val: h.gpu_percent },
    { key: 'cpu', val: h.cpu_percent },
    { key: 'ram', val: h.ram_percent },
  ];

  for (const m of metrics) {
    const bar = card.querySelector(`[data-metric="${m.key}"]`);
    const text = card.querySelector(`[data-metric="${m.key}-text"]`);
    // GPU bar is meaningless on psutil (always 0) — keep it empty
    const isGpuOnPsutil = (m.key === 'gpu' && source === 'psutil');
    if (bar) {
      const pct = isGpuOnPsutil ? 0 : Math.min(100, Math.max(0, m.val != null ? m.val : 0));
      bar.style.width = `${pct}%`;
      bar.className = 'bar-fill' + (pct > 80 ? ' crit' : pct > 60 ? ' warn' : '');
    }
    if (text) {
      text.textContent = (m.key === 'gpu') ? fmtGpuPct(m.val, source) : fmtPct(m.val);
    }
  }

  const tempEl = card.querySelector('[data-metric="temp-text"]');
  if (tempEl) tempEl.textContent = fmtGpuTemp(h.gpu_temp_c, source);

  const loadEl = card.querySelector('[data-metric="load-text"]');
  if (loadEl) loadEl.textContent = h.load_score != null ? h.load_score.toFixed(1) : '--';

  const fpsEl = card.querySelector('[data-metric="fps-list"]');
  if (fpsEl) {
    const entries = Object.entries(fps);
    if (entries.length > 0) {
      fpsEl.innerHTML = entries
        .map(([cam, f]) => {
          // BUG-14: pct was computed but never used in the output string.
          // Use it to colour the FPS value: red < 15fps, yellow < 25fps, green otherwise.
          const pct = Math.min(100, (f / targetFps) * 100);
          const colour = pct < 50 ? '#e74c3c' : pct < 83 ? '#f39c12' : '#2ecc71';
          return `<span>${escHtml(cam)}: <strong style="color:${colour}">${f.toFixed(1)}</strong> fps</span>`;
        })
        .join('');
    } else {
      fpsEl.innerHTML = '<span style="color:#555">No active cameras</span>';
    }
  }
}

function updateSidebar() {
  const cluster = getCurrentCluster();
  if (!cluster || cluster.edges.length === 0) {
    SIDEBAR.innerHTML = '<div style="color:#555;text-align:center;padding:20px;font-size:12px;">No edges in this cluster</div>';
    return;
  }
  ensureSidebarCards(cluster.edges);

  // Update edge count badge
  const total = Object.keys(edges).length;
  const online = Object.values(edges).filter(e => e.online).length;
  EDGE_BADGE.textContent = `${total} edges`;
  EDGE_BADGE.className = `badge ${online > 0 ? 'online' : 'offline'}`;
}

// ── Render: Cluster nav ──────────────────────────────────────
function renderClusterNav() {
  const showNav = clusters.length > 1;
  PREV_BTN.style.display = showNav ? '' : 'none';
  NEXT_BTN.style.display = showNav ? '' : 'none';
  CLUSTER_DOTS.style.display = showNav ? '' : 'none';

  if (!showNav) {
    CLUSTER_TITLE.textContent = clusters.length === 1 ? clusters[0].id : 'Cluster';
    return;
  }

  CLUSTER_TITLE.textContent = clusters[currentClusterIdx].id;
  PREV_BTN.disabled = currentClusterIdx <= 0;
  NEXT_BTN.disabled = currentClusterIdx >= clusters.length - 1;

  CLUSTER_DOTS.innerHTML = clusters
    .map((c, i) => `<span class="dot ${i === currentClusterIdx ? 'active' : ''}" data-idx="${i}"></span>`)
    .join('');
}

function switchCluster(delta) {
  const newIdx = currentClusterIdx + delta;
  if (newIdx < 0 || newIdx >= clusters.length) return;

  // Clean up current cluster's streams
  const current = getCurrentCluster();
  if (current) {
    const currentStreams = getStreamNamesForCluster(current.edges);
    for (const name of [...currentStreams, ...mediaMtxStreamNames]) {
      cleanupStream(name);
      delete streamStates[name];
    }
  }

  currentClusterIdx = newIdx;
  renderClusterNav();
  renderVideoGrid();
  updateSidebar();
}

// ── Render: Violations ───────────────────────────────────────
function renderViolations() {
  VIOLATIONS_HEADER_COUNT.textContent = violations.length;

  if (violations.length === 0) {
    VIOLATION_LIST.innerHTML = '<div class="violation-empty">No violations yet</div>';
    return;
  }

  let html = '';
  for (const v of violations) {
    const ts = v.timestamp || v.ts || 0;
    const snapFile = v.snapshot_file || '';
    // BUG-13: snapshot_file is a relative path like "2026-05-28/edge01/cam_123.jpg".
    // Preserve the date directory component — the server's handle_snapshot
    // matches on {node_id}/{filename} and searches all date dirs, so we only
    // need to strip the leading date segment but keep node_id in the URL.
    // URL pattern: /api/snapshots/{node_id}/{filename}
    // snapshot_file format: {date}/{node_id}/{filename}
    const snapParts = snapFile ? snapFile.split('/') : [];
    const snapUrl = snapParts.length >= 3
      ? `/api/snapshots/${encodeURIComponent(snapParts[1])}/${encodeURIComponent(snapParts.slice(2).join('/'))}`
      : (snapParts.length === 1 ? `/api/snapshots/${encodeURIComponent(v.node_id)}/${encodeURIComponent(snapParts[0])}` : '');

    html += `
      <div class="violation-card" data-snap="${escAttr(snapUrl)}" title="${escAttr(fmtTime(ts))} - ${escAttr(v.node_id)}">
        <span class="v-time">${escHtml(fmtTime(ts))}</span>
        <div class="v-detail">
          <span class="v-node">${escHtml(v.node_id)}</span>
          <span class="v-plate">${escHtml(v.plate || v.license_plate || '?')}</span>
          <span class="v-speed">${v.speed_kmh != null ? v.speed_kmh.toFixed(0) + ' km/h' : '?'}</span>
          ${snapUrl ? `<img class="v-thumb" data-snap="${escAttr(snapUrl)}" src="${escAttr(snapUrl)}">` : ''}
        </div>
      </div>
    `;
  }
  VIOLATION_LIST.innerHTML = html;
  VIOLATION_LIST.scrollLeft = 0;
}

function openModal(url) {
  if (!url) return;
  MODAL_IMG.src = url;
  MODAL.classList.add('open');
}

function escAttr(s) {
  if (typeof s !== 'string') s = String(s || '');
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escHtml(s) {
  if (typeof s !== 'string') s = String(s || '');
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Violation history ────────────────────────────────────────
async function fetchViolationHistory() {
  const params = new URLSearchParams();
  const dateVal = FILTER_DATE.value;
  const nodeVal = FILTER_NODE.value;
  if (dateVal) params.set('date', dateVal);
  if (nodeVal) params.set('node_id', nodeVal);
  params.set('limit', '50');
  try {
    const resp = await fetch(`/api/violations?${params}`);
    if (resp.ok) {
      const data = await resp.json();
      // Merge into existing violations (dedup by timestamp + node_id + plate)
      const seen = new Set(violations.map(v => `${v.timestamp}-${v.node_id}-${v.plate || v.license_plate}`));
      for (const v of data) {
        const key = `${v.timestamp}-${v.node_id}-${v.plate || v.license_plate}`;
        if (!seen.has(key)) {
          violations.push(v);
          seen.add(key);
        }
      }
      violations.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      if (violations.length > 200) violations.length = 200;
      renderViolations();
    }
  } catch(e) {}
}

// ── WebSocket ────────────────────────────────────────────────
function connectWS() {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  if (wsPingTimer) clearInterval(wsPingTimer);

  STATUS.textContent = 'Connecting...';
  STATUS.className = '';

  try {
    ws = new WebSocket(WS_URL);
  } catch(e) {
    STATUS.textContent = 'Connection failed. Retrying...';
    STATUS.className = 'error';
    reconnectTimer = setTimeout(connectWS, 3000);
    return;
  }

  ws.onopen = () => {
    STATUS.textContent = 'Connected';
    STATUS.className = 'online';
    wsPingTimer = setInterval(() => {
      try { ws.send(JSON.stringify({ action: 'ping' })); } catch(e) {}
    }, 30000);
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      handleWSMessage(msg);
    } catch(e) {}
  };

  ws.onclose = () => {
    STATUS.textContent = 'Disconnected. Reconnecting...';
    STATUS.className = 'error';
    if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
    reconnectTimer = setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    // BUG-19: clear the ping timer on error so it doesn't leak when
    // onerror fires without a subsequent onclose (e.g. manual ws.close()).
    if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
  };
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'init':
      for (const edge of msg.edges || []) {
        edges[edge.node_id] = edge;
      }
      rebuildClusters();
      renderClusterNav();
      renderVideoGrid();
      updateSidebar();
      pollStreams();
      // Fill filter node dropdown
      populateNodeFilter();
      break;

    case 'edge_list':
      for (const edge of msg.edges || []) {
        edges[edge.node_id] = edge;
      }
      rebuildClusters();
      renderClusterNav();
      renderVideoGrid();
      updateSidebar();
      break;

    case 'edge_registered':
      if (!edges[msg.node_id]) {
        edges[msg.node_id] = { node_id: msg.node_id, online: true, health: {} };
      }
      edges[msg.node_id].ip = msg.ip || edges[msg.node_id].ip;
      edges[msg.node_id].online = true;
      rebuildClusters();
      renderClusterNav();
      renderVideoGrid();
      updateSidebar();
      populateNodeFilter();
      pollStreams();
      break;

    case 'edge_offline':
      if (edges[msg.node_id]) {
        edges[msg.node_id].online = false;
      }
      rebuildClusters();
      renderClusterNav();
      renderVideoGrid();
      updateSidebar();
      break;

    case 'health_update':
      {
        if (!edges[msg.node_id]) {
          edges[msg.node_id] = { node_id: msg.node_id, online: true, health: {} };
        }
        const edge = edges[msg.node_id];
        edge.online = true;
        edge.last_heartbeat = msg.timestamp || Date.now() / 1000;
        const health = { ...msg };
        delete health.type;
        delete health.node_id;
        edge.health = health;
        // Refresh the video cell label to show updated active cameras
        const labelEl = VIDEO_GRID.querySelector(`[data-node-id="${msg.node_id}"]`);
        if (labelEl) {
          const activeCams = (health.pipeline && health.pipeline.active_cameras) || [];
          labelEl.textContent = activeCams.length > 0
            ? `${msg.node_id} (${activeCams.join(', ')})`
            : msg.node_id;
        }
        // In-place sidebar update for current cluster
        const cluster = getCurrentCluster();
        if (cluster && cluster.edges.some(e => e.node_id === msg.node_id)) {
          const card = SIDEBAR.querySelector(`[data-node-id="${msg.node_id}"]`);
          if (card) {
            updateSidebarCard(card, edge);
          } else {
            updateSidebar();
          }
        }
      }
      break;

    case 'violation':
      violations.unshift(msg);
      if (violations.length > 200) violations.length = 200;
      renderViolations();
      break;
  }
}

function populateNodeFilter() {
  const nodeIds = Object.keys(edges).sort();
  const currentVal = FILTER_NODE.value;
  FILTER_NODE.innerHTML = '<option value="">All nodes</option>' +
    nodeIds.map(n => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('');
  FILTER_NODE.value = currentVal;
}

// ── Stream polling ───────────────────────────────────────────
async function pollStreams() {
  try {
    const resp = await fetch(CONFIG.MEDIAMTX_API || '/api/streams');
    if (!resp.ok) return;
    const data = await resp.json();
    const items = data.items || [];
    // Track all live MediaMTX stream names for availability checks,
    // but do NOT add them to the video grid — only edge node_id streams
    // (from getStreamNamesForCluster) are displayed.
    mediaMtxStreamNames = items
      .filter(p => p.source && p.source.type === 'rtspSession')
      .map(p => p.name);

    // Re-render grid only if the set of edge-derived stream names changed
    const cluster = getCurrentCluster();
    const edgeStreams = cluster ? getStreamNamesForCluster(cluster.edges) : [];
    const existingNames = Object.keys(streamStates);
    const needsUpdate =
      edgeStreams.some(n => !existingNames.includes(n)) ||
      existingNames.some(n => !edgeStreams.includes(n));

    if (needsUpdate) renderVideoGrid();
  } catch(e) {}
}

// ── Init ─────────────────────────────────────────────────────
function init() {
  // Cluster nav
  PREV_BTN.addEventListener('click', () => switchCluster(-1));
  NEXT_BTN.addEventListener('click', () => switchCluster(1));
  CLUSTER_DOTS.addEventListener('click', (e) => {
    const dot = e.target.closest('.dot');
    if (dot && dot.dataset.idx != null) {
      const idx = parseInt(dot.dataset.idx);
      if (idx !== currentClusterIdx) switchCluster(idx - currentClusterIdx);
    }
  });

  // Violation card click delegation
  VIOLATION_LIST.addEventListener('click', (e) => {
    const card = e.target.closest('.violation-card');
    const thumb = e.target.closest('.v-thumb');
    if (thumb) {
      e.stopPropagation();
      openModal(thumb.dataset.snap);
    } else if (card) {
      openModal(card.dataset.snap);
    }
  });

  // Violation filters
  FILTER_APPLY.addEventListener('click', fetchViolationHistory);
  FILTER_DATE.value = fmtDate(new Date());

  // Modal close on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') MODAL.classList.remove('open');
  });

  // Resize observer for video grid
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => {
      const cluster = getCurrentCluster();
      if (cluster && cluster.edges.some(e => e.online)) {
        renderVideoGrid();
      }
    });
    ro.observe(VIDEO_GRID);
  }

  // Connect and start polling
  connectWS();
  streamPollTimer = setInterval(pollStreams, 5000);
}

// Override openModal globally for onclick handlers
window.openModal = openModal;

init();

})();
</script>
